<title>FA Ledger — ACCA Study Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --paper:#F6F4EA;
    --paper-line:#DCD8C4;
    --ink:#20293A;
    --ink-soft:#5B6472;
    --green:#2F5233;
    --green-deep:#1F3A24;
    --brass:#A8823C;
    --brass-soft:#D9C9A3;
    --red:#A63A2E;
    --card:#FFFFFF;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px);
    background-size: 100% 2.1em;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  a{color:inherit;}
  ::selection{background:var(--brass-soft);}

  .wrap{max-width:920px;margin:0 auto;padding:28px 20px 80px;}

  /* ---------- Header ---------- */
  header.top{
    display:flex;justify-content:space-between;align-items:flex-end;
    gap:16px;flex-wrap:wrap;
    border-bottom:3px double var(--ink);
    padding-bottom:14px;margin-bottom:22px;
  }
  .brand{display:flex;flex-direction:column;gap:2px;}
  .brand .mark{
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;
    color:var(--brass);text-transform:uppercase;font-weight:600;
  }
  .brand h1{
    font-family:'Lora',serif;font-weight:700;font-size:28px;margin:0;
    color:var(--green-deep);letter-spacing:-.01em;
  }
  .brand .sub{font-size:13px;color:var(--ink-soft);}
  .userbox{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);text-align:right;}
  .userbox button{
    margin-top:6px;background:none;border:1px solid var(--ink-soft);color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;font-size:11px;padding:5px 10px;border-radius:6px;cursor:pointer;
  }
  .userbox button:hover{border-color:var(--ink);color:var(--ink);}

  /* ---------- Auth screen ---------- */
  .auth-shell{
    max-width:420px;margin:8vh auto;padding:0 20px;
  }
  .auth-card{
    background:var(--card);border:1px solid var(--paper-line);border-radius:var(--radius);
    padding:32px 28px;box-shadow:0 1px 3px rgba(32,41,58,.06), 0 8px 24px rgba(32,41,58,.05);
  }
  .auth-card h1{font-family:'Lora',serif;font-size:24px;margin:0 0 4px;color:var(--green-deep);}
  .auth-card p.tag{color:var(--ink-soft);font-size:13px;margin:0 0 22px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em;}
  .field input{
    width:100%;padding:10px 12px;border:1px solid #C9C4AE;border-radius:7px;
    font-family:'Inter',sans-serif;font-size:14px;background:#FCFBF6;color:var(--ink);
  }
  .field input:focus{outline:2px solid var(--brass-soft);border-color:var(--brass);}
  .btn-primary{
    width:100%;padding:11px;border:none;border-radius:7px;background:var(--green);color:#fff;
    font-weight:600;font-size:14px;cursor:pointer;font-family:'Inter',sans-serif;
  }
  .btn-primary:hover{background:var(--green-deep);}
  .btn-primary:disabled{opacity:.55;cursor:default;}
  .auth-toggle{text-align:center;margin-top:16px;font-size:13px;color:var(--ink-soft);}
  .auth-toggle button{background:none;border:none;color:var(--brass);font-weight:600;cursor:pointer;font-size:13px;text-decoration:underline;}
  .auth-msg{font-size:13px;padding:9px 11px;border-radius:6px;margin-bottom:14px;}
  .auth-msg.err{background:#FBEAE7;color:var(--red);}
  .auth-msg.ok{background:#EAF1EA;color:var(--green-deep);}
  .setup-note{font-size:12px;color:var(--ink-soft);text-align:center;margin-top:18px;line-height:1.5;}

  /* ---------- Trial balance / summary ---------- */
  .tb-card{
    background:var(--card);border:1px solid var(--paper-line);border-radius:var(--radius);
    padding:18px 20px;margin-bottom:22px;
    box-shadow:0 1px 2px rgba(32,41,58,.05);
  }
  .tb-title{
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink-soft);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;
  }
  .tb-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--paper-line);}
  .tb-col{padding:12px 14px 4px;}
  .tb-col.dr{border-right:1px solid var(--paper-line);}
  .tb-col h3{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;color:var(--ink-soft);margin:0 0 8px;text-transform:uppercase;}
  .tb-row{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:13px;padding:4px 0;color:var(--ink);}
  .tb-total{
    display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;
    border-top:1px solid var(--ink);padding-top:7px;margin-top:6px;
  }
  .tb-status{
    margin-top:14px;text-align:center;padding:9px;border-radius:7px;font-family:'IBM Plex Mono',monospace;
    font-size:12px;letter-spacing:.06em;font-weight:600;
  }
  .tb-status.balanced{background:#EAF1EA;color:var(--green-deep);}
  .tb-status.unbalanced{background:#FBEAE7;color:var(--red);}
  .tb-bar{height:8px;background:var(--paper-line);border-radius:5px;overflow:hidden;margin-top:12px;}
  .tb-bar-fill{height:100%;background:var(--green);border-radius:5px;transition:width .4s ease;}
  .stats-row{display:flex;gap:14px;margin-top:14px;flex-wrap:wrap;}
  .stat-pill{
    display:flex;align-items:center;gap:7px;background:#FCFBF6;border:1px solid var(--paper-line);
    border-radius:20px;padding:6px 13px;font-size:12px;color:var(--ink-soft);
  }
  .stat-pill b{color:var(--ink);font-family:'IBM Plex Mono',monospace;}
  .seal{
    width:22px;height:22px;border-radius:50%;border:2px solid var(--brass);color:var(--brass);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:'IBM Plex Mono',monospace;
  }

  /* ---------- Week tabs ---------- */
  .week-tabs{
    display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;
    scrollbar-width:thin;
  }
  .week-tab{
    flex:0 0 auto;padding:8px 13px;border-radius:7px;border:1px solid var(--paper-line);
    background:var(--card);cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:12px;
    color:var(--ink-soft);white-space:nowrap;position:relative;
  }
  .week-tab .n{font-weight:700;color:var(--ink);}
  .week-tab.active{border-color:var(--green);background:var(--green);color:#fff;}
  .week-tab.active .n{color:#fff;}
  .week-tab .dot{
    display:inline-block;width:6px;height:6px;border-radius:50%;margin-left:6px;background:var(--brass);
    vertical-align:middle;
  }

  .week-head{margin-bottom:14px;}
  .week-head .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;color:var(--brass);text-transform:uppercase;}
  .week-head h2{font-family:'Lora',serif;font-size:21px;margin:2px 0 0;color:var(--green-deep);}

  /* ---------- Day rows ---------- */
  .day{
    background:var(--card);border:1px solid var(--paper-line);border-radius:9px;
    margin-bottom:9px;overflow:hidden;
  }
  .day.today{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass);}
  .day-main{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;cursor:pointer;}
  .checkbox{
    flex:0 0 auto;width:22px;height:22px;border-radius:5px;border:1.5px solid #B9B39A;
    display:flex;align-items:center;justify-content:center;margin-top:2px;background:#FCFBF6;
    transition:.15s;
  }
  .checkbox svg{width:13px;height:13px;opacity:0;transition:.15s;}
  .day.done .checkbox{background:var(--green);border-color:var(--green);}
  .day.done .checkbox svg{opacity:1;}
  .day-body{flex:1;min-width:0;}
  .day-date{
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);
    display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:2px;
  }
  .day-date .today-tag{
    background:var(--brass);color:#fff;font-size:9px;font-weight:700;padding:1px 6px;border-radius:4px;letter-spacing:.06em;
  }
  .type-tag{font-size:9px;font-weight:700;letter-spacing:.06em;padding:1px 6px;border-radius:4px;text-transform:uppercase;}
  .type-L{background:#E7EEF5;color:#33587A;}
  .type-P{background:#FBEFE2;color:#9C6A28;}
  .type-R{background:#EFEAF6;color:#5C4A94;}
  .type-M{background:#FBEAE7;color:var(--red);}
  .type-C{background:#EAF1EA;color:var(--green-deep);}
  .day-title{font-size:14.5px;font-weight:600;color:var(--ink);line-height:1.35;}
  .day.done .day-title{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:#C9C4AE;}
  .chev{flex:0 0 auto;color:var(--ink-soft);margin-top:4px;transition:transform .15s;font-size:12px;}
  .day.open .chev{transform:rotate(90deg);}

  .day-detail{display:none;padding:0 14px 14px 48px;}
  .day.open .day-detail{display:block;}
  .day-detail ul{margin:0 0 10px;padding-left:16px;font-size:13px;color:var(--ink-soft);line-height:1.6;}
  .day-detail ul li{margin-bottom:2px;}
  .note-box textarea{
    width:100%;min-height:52px;border:1px solid var(--paper-line);border-radius:6px;padding:8px 9px;
    font-family:'Inter',sans-serif;font-size:12.5px;color:var(--ink);background:#FCFBF6;resize:vertical;
  }
  .note-label{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;display:block;}

  .loading{text-align:center;padding:60px 0;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:13px;}
  .config-warning{
    max-width:560px;margin:10vh auto;padding:26px 26px;background:#FBEAE7;border:1px solid #E7BDB6;
    border-radius:10px;color:var(--red);font-size:13.5px;line-height:1.7;
  }
  .config-warning h2{font-family:'Lora',serif;font-size:19px;margin:0 0 10px;}
  .config-warning code{background:#fff;padding:1px 6px;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:12px;}

  @media (max-width:520px){
    .brand h1{font-size:22px;}
    .tb-grid{grid-template-columns:1fr;}
    .tb-col.dr{border-right:none;border-bottom:1px solid var(--paper-line);}
  }

  /* ---------- Edit mode ---------- */
  .edit-toggle{
    font-family:'IBM Plex Mono',monospace;font-size:12px;padding:6px 12px;border-radius:6px;
    border:1px solid var(--brass);background:#fff;color:var(--brass);cursor:pointer;font-weight:600;
  }
  .edit-toggle.on{background:var(--brass);color:#fff;}
  .day-controls{display:flex;flex-direction:column;gap:2px;flex:0 0 auto;margin-top:1px;}
  .icon-btn{
    width:22px;height:22px;border:1px solid var(--paper-line);background:#FCFBF6;border-radius:5px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft);font-size:11px;
    line-height:1;padding:0;
  }
  .icon-btn:hover{border-color:var(--brass);color:var(--brass);}
  .icon-row{display:flex;gap:4px;}
  .icon-btn.danger:hover{border-color:var(--red);color:var(--red);}
  .edit-form{padding:2px 0 4px;}
  .edit-form label{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin:10px 0 4px;}
  .edit-form input[type=text], .edit-form input[type=date], .edit-form select, .edit-form textarea{
    width:100%;padding:8px 10px;border:1px solid #C9C4AE;border-radius:6px;font-family:'Inter',sans-serif;
    font-size:13.5px;color:var(--ink);background:#FCFBF6;
  }
  .edit-form textarea{min-height:78px;resize:vertical;}
  .edit-actions{display:flex;gap:8px;margin-top:12px;}
  .edit-actions button{
    padding:7px 14px;border-radius:6px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;
  }
  .btn-save{background:var(--green);border:1px solid var(--green);color:#fff;}
  .btn-cancel{background:#fff;border:1px solid var(--paper-line);color:var(--ink-soft);}
  .add-day-row{
    display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;margin-top:4px;
    border:1.5px dashed var(--paper-line);border-radius:9px;cursor:pointer;color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;font-size:12px;
  }
  .add-day-row:hover{border-color:var(--brass);color:var(--brass);}
</style>

const TYPE_LABEL = {L:"Learn", P:"Practice", R:"Review", M:"Mock", C:"Checkpoint"};
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

// Flatten PLAN into base items keyed by stable id, plus the default order.
let baseItemsById = {};
let baseOrder = [];
let baseWeekOf = {}; // id -> original week number (for subtitle heuristic)

function isoDate(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}
function parseIso(s){
  return new Date(s+'T00:00:00');
}

(function buildBase(){
  let idx = 0;
  PLAN.forEach((week, wi)=>{
    week.days.forEach((d)=>{
      const id = idx+1;
      const date = new Date(START_DATE);
      date.setDate(date.getDate() + idx);
      baseItemsById[id] = {t:d.t, y:d.y, tasks:d.tasks.slice(), date:isoDate(date)};
      baseOrder.push(id);
      baseWeekOf[id] = wi+1;
      idx++;
    });
  });
})();

function fmtDate(d){
  return DOW[d.getDay()]+", "+d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
}
function sameDay(a,b){
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}

/* ---------- App state ---------- */

const app = document.getElementById('app');

function resetToBase(){
  itemsById = JSON.parse(JSON.stringify(baseItemsById));
  order = baseOrder.slice();
}
resetToBase();

function buildGlobalDays(){
  const startMid = new Date(START_DATE.getFullYear(), START_DATE.getMonth(), START_DATE.getDate());
  const arr = order
    .filter(id=>itemsById[id])
    .map(id=>({id, ...itemsById[id]}))
    .sort((a,b)=> parseIso(a.date) - parseIso(b.date) || a.id-b.id);
  return arr.map(item=>{
    const date = parseIso(item.date);
    const diffDays = Math.round((date - startMid) / 86400000);
    const week = Math.floor(diffDays/7) + 1;
    return {...item, week, date};
  });
}

function weekTitleFor(weekNum, weekDays){
  const ids = weekDays.filter(d=>d.week===weekNum).map(d=>d.id);
  const baseWeeks = ids.map(id=>baseWeekOf[id]).filter(Boolean);
  if(baseWeeks.length && baseWeeks.every(w=>w===baseWeeks[0]) && ids.length===7){
    return PLAN[baseWeeks[0]-1].title;
  }
  return "Custom week";
}

/* ---------- Dashboard ---------- */
function computeStats(days){
  const total = days.length;
  const done = days.filter(d=>progress[d.id]?.completed).length;
  const remaining = total - done;
  const pct = total ? Math.round((done/total)*100) : 0;

  let streak = 0;
  const doneIds = days.filter(d=>progress[d.id]?.completed).map(d=>d.id);
  const doneIndexSet = new Set(days.map((d,i)=>progress[d.id]?.completed ? i : -1).filter(i=>i>=0));
  // streak counted by position in sequence, walking back from the latest completed position
  const positions = [...doneIndexSet].sort((a,b)=>b-a);
  if(positions.length){
    let expected = positions[0];
    for(const p of positions){
      if(p===expected){ streak++; expected--; } else break;
    }
  }
  const today = new Date();
  const todayEntry = days.find(d=>sameDay(d.date, today));
  return {total, done, remaining, pct, streak, todayEntry};
}

        </div>

      <div class="tb-status ${stats.pct===100?'balanced':'unbalanced'}">

      </div>
      <div class="stats-row">
        <div class="stat-pill"><span class="seal">${stats.streak}</span> day streak</div>
        <div class="stat-pill">Today: <b>${stats.todayEntry ? fmtDate(stats.todayEntry.date) : '—'}</b></div>
        <div class="stat-pill">Week <b>${activeWeek}</b> of ${totalWeeks}</div>
      </div>
    </div>

    ${editMode ? `<div class="auth-msg ok" style="margin-bottom:16px;">Edit mode is on — use ✎ to rename a day, ▲▼ to move it earlier/later, × to delete it, or add a new day at the bottom of a week.</div>` : ''}

    <div class="week-tabs" id="weekTabs"></div>

    <div class="week-head">
      <div class="eyebrow">Week ${activeWeek} of ${totalWeeks}</div>
      <h2>${wTitle}</h2>
    </div>

    <div id="dayList"></div>
  </div>`;

  document.getElementById('signOutBtn').onclick = async ()=>{
    await supabase.auth.signOut();
    session = null; progress = {}; resetToBase();
    render();
  };
  document.getElementById('editToggleBtn').onclick = ()=>{
    editMode = !editMode;
    editingId = null;
    render();
  };

  const tabsEl = document.getElementById('weekTabs');
  for(let wn=1; wn<=totalWeeks; wn++){
    const wDays = days.filter(d=>d.week===wn);
    const wDone = wDays.filter(d=>progress[d.id]?.completed).length;
    const complete = wDone===wDays.length && wDays.length>0;
    const btn = document.createElement('button');
    btn.className = 'week-tab' + (wn===activeWeek ? ' active':'');
    btn.innerHTML = `<span class="n">${wn}</span>${complete ? '<span class="dot"></span>' : ''}`;
    btn.onclick = ()=>{ activeWeek = wn; openDay=null; editingId=null; render(); };
    tabsEl.appendChild(btn);
  }

  const listEl = document.getElementById('dayList');
  weekDays.forEach((d, iInWeek)=>{
    const isDone = !!progress[d.id]?.completed;
    const isToday = sameDay(d.date, today);
    const isOpen = openDay===d.id;
    const isEditing = editingId===d.id;
    const note = progress[d.id]?.note || '';

    const el = document.createElement('div');
    el.className = 'day' + (isDone?' done':'') + (isToday?' today':'') + (isOpen||isEditing?' open':'');

    const controls = editMode ? `

          ${d.tasks.length ? `<ul>${d.tasks.map(x=>`<li>${x}</li>`).join('')}</ul>` : ''}

  if(editMode){
    const addRow = document.createElement('div');
    addRow.className = 'add-day-row';
    addRow.textContent = '+ Add a day to this week';
    addRow.onclick = ()=>addDayAfter(weekDays.length ? weekDays[weekDays.length-1].id : null);
    listEl.appendChild(addRow);
  }

  wireDayEvents(listEl);
}

function renderEditForm(d){
  return `
    <div class="edit-form" data-form="${d.id}">
      <label>Date</label>
      <input type="date" data-field="date" value="${isoDate(d.date)}" />
      <label>Title</label>
      <input type="text" data-field="t" value="${d.t.replace(/"/g,'&quot;')}" />
      <label>Type</label>
      <select data-field="y">
        ${Object.entries(TYPE_LABEL).map(([k,v])=>`<option value="${k}" ${d.y===k?'selected':''}>${v}</option>`).join('')}
      </select>
      <label>Tasks (one per line)</label>
      <textarea data-field="tasks">${d.tasks.join('\n')}</textarea>
      <div class="edit-actions">
        <button class="btn-save" data-save="${d.id}">Save</button>
        <button class="btn-cancel" data-cancel="${d.id}">Cancel</button>
      </div>
    </div>
  `;
}

function wireDayEvents(listEl){
  listEl.querySelectorAll('[data-check]').forEach(elx=>{
    elx.onclick = (e)=>{ e.stopPropagation(); toggleDay(Number(elx.dataset.check)); };
  });
  listEl.querySelectorAll('[data-toggle]').forEach(elx=>{
    elx.onclick = ()=>{
      const id = Number(elx.dataset.toggle);
      if(editMode) return;
      openDay = openDay===id ? null : id;
      render();
    };
  });
  listEl.querySelectorAll('[data-note]').forEach(elx=>{
    elx.onblur = ()=> saveNote(Number(elx.dataset.note), elx.value);
  });
  listEl.querySelectorAll('[data-edit]').forEach(elx=>{
    elx.onclick = (e)=>{ e.stopPropagation(); editingId = Number(elx.dataset.edit); openDay=null; render(); };
  });
  listEl.querySelectorAll('[data-cancel]').forEach(elx=>{
    elx.onclick = (e)=>{ e.stopPropagation(); editingId = null; render(); };
  });
  listEl.querySelectorAll('[data-save]').forEach(elx=>{
    elx.onclick = (e)=>{
      e.stopPropagation();
      const id = Number(elx.dataset.save);
      const form = listEl.querySelector(`[data-form="${id}"]`);
      const t = form.querySelector('[data-field="t"]').value.trim() || 'Untitled day';
      const y = form.querySelector('[data-field="y"]').value;
      const tasks = form.querySelector('[data-field="tasks"]').value.split('\n').map(s=>s.trim()).filter(Boolean);
      const dateVal = form.querySelector('[data-field="date"]').value;
      const date = dateVal || itemsById[id].date;
      itemsById[id] = {t, y, tasks, date};
      editingId = null;
      savePlanState();
      const days = buildGlobalDays();
      const found = days.find(x=>x.id===id);
      if(found) activeWeek = found.week;
      render();
    };
  });
  listEl.querySelectorAll('[data-delete]').forEach(elx=>{
    elx.onclick = (e)=>{
      e.stopPropagation();
      const id = Number(elx.dataset.delete);
      if(order.length<=1) return;
      if(!confirm('Delete this day from the plan?')) return;
      order = order.filter(x=>x!==id);
      delete itemsById[id];
      if(editingId===id) editingId = null;
      savePlanState();
      render();
    };
  });
  listEl.querySelectorAll('[data-move]').forEach(elx=>{
    elx.onclick = (e)=>{
      e.stopPropagation();
      const [dir, idStr] = elx.dataset.move.split(':');
      const id = Number(idStr);
      const item = itemsById[id];
      if(!item) return;
      const d = parseIso(item.date);
      d.setDate(d.getDate() + (dir==='up' ? -1 : 1));
      item.date = isoDate(d);
      savePlanState();
      const days = buildGlobalDays();
      const found = days.find(x=>x.id===id);
      if(found) activeWeek = found.week;
      render();
    };
  });
}

function addDayAfter(afterId){
  const newId = Date.now();
  let newDate;
  if(afterId!=null && itemsById[afterId]){
    const d = parseIso(itemsById[afterId].date);
    d.setDate(d.getDate()+1);
    newDate = isoDate(d);
  } else {
    newDate = isoDate(START_DATE);
  }
  itemsById[newId] = {t:'New day', y:'L', tasks:[], date:newDate};
  order.push(newId);
  editingId = newId;
  savePlanState();
  const days = buildGlobalDays();
  const found = days.find(x=>x.id===newId);
  if(found) activeWeek = found.week;
  render();
}

async function toggleDay(id){
  const cur = progress[id]?.completed || false;
  progress[id] = {...(progress[id]||{}), completed: !cur, completed_at: !cur ? new Date().toISOString() : null};
  render();
  try{
    await supabase.from('day_progress').upsert({
      user_id: session.user.id,
      day_id: id,
      completed: !cur,
      completed_at: !cur ? new Date().toISOString() : null,
      note: progress[id]?.note || ''
    }, {onConflict:'user_id,day_id'});
  }catch(err){ console.error('sync error', err); }
}

async function saveNote(id, text){
  progress[id] = {...(progress[id]||{}), note:text};
  try{
    await supabase.from('day_progress').upsert({
      user_id: session.user.id,
      day_id: id,
      completed: progress[id]?.completed || false,
      completed_at: progress[id]?.completed_at || null,
      note: text
    }, {onConflict:'user_id,day_id'});
  }catch(err){ console.error('sync error', err); }
}

let saveTimer = null;
function savePlanState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      await supabase.from('plan_state').upsert({
        user_id: session.user.id,
        items: itemsById,
        order_list: order,
        updated_at: new Date().toISOString()
      }, {onConflict:'user_id'});
    }catch(err){ console.error('plan save error', err); }
  }, 400);
}

async function loadAll(){
  progress = {};
  resetToBase();
  try{
    const {data, error} = await supabase.from('day_progress').select('*').eq('user_id', session.user.id);
    if(error) throw error;
    (data||[]).forEach(row=>{
      progress[row.day_id] = {completed: row.completed, completed_at: row.completed_at, note: row.note};
    });
  }catch(err){ console.error('load progress error', err); }

  try{
    const {data, error} = await supabase.from('plan_state').select('*').eq('user_id', session.user.id).maybeSingle();
    if(error) throw error;
    if(data && data.items && data.order_list){
      itemsById = data.items;
      order = data.order_list;
    }
  }catch(err){ console.error('load plan state error', err); }

  const days = buildGlobalDays();
  const today = new Date();
  const todayEntry = days.find(d=>sameDay(d.date, today));
  if(todayEntry){ activeWeek = todayEntry.week; }
}

/* ---------- Boot ---------- */
async function boot(){
  if(!configOk){ render(); return; }
  supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const {data} = await supabase.auth.getSession();
  session = data.session;
  if(session){ await loadAll(); }
  render();

  supabase.auth.onAuthStateChange((_event, s)=>{
    session = s;
  });
}
boot();
})();
